services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discode}
      POSTGRES_USER: ${POSTGRES_USER:-discode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - discode-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discode} -d ${POSTGRES_DB:-discode}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  discode-postgres-data:
